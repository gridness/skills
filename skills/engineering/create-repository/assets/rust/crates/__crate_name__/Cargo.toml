[package]
name = "{{ crate_name }}"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "{{ project_description_toml }}"
__GITHUB_ONLY_START__
repository = "https://github.com/{{ github_slug }}"
__GITHUB_ONLY_END__

[[bin]]
name = "{{ crate_name }}"
path = "src/main.rs"
